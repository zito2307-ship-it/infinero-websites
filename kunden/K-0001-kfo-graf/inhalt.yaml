  - typ: leistungen
    anker: leistungen
    menue: Leistungen
    label: Leistungen
    titel: Unser Behandlungsspektrum
    text: Welche Behandlung zu Ihnen passt, besprechen wir nach der Untersuchung persönlich mit Ihnen.
    eintraege:
      - icon: herz
        titel: Kieferorthopädie für Kinder
        text: "Der richtige Zeitpunkt ist oft der Zahnwechsel im Seitenzahnbereich. Manche Fehlstellungen sollten früher behandelt werden – wir beraten Sie individuell."
        details:
          einleitung: "Viele Zahn- und Kieferfehlstellungen lassen sich im Wachstum besonders gut beeinflussen. Deshalb lohnt sich ein früher Blick – auch wenn die eigentliche Behandlung oft erst später beginnt."
          abschnitte:
            - titel: Wann ist der richtige Zeitpunkt?
              text:
                - "In der Regel ist die zweite Phase des Zahnwechsels ein günstiger Zeitpunkt – also wenn die seitlichen Milchzähne und Milcheckzähne durch bleibende Zähne ersetzt werden. Das ist meist zwischen dem 9. und 12. Lebensjahr."
                - "Bestimmte Fehlstellungen – etwa ein Kreuzbiss, ein stark vorstehender Unterkiefer oder ein offener Biss – sollten früher behandelt werden. Ein erster Termin im Grundschulalter schafft Klarheit."
            - titel: Wie läuft die Behandlung ab?
              text:
                - "Nach Untersuchung, Röntgenbildern und Abdrücken bzw. Scans erstellen wir einen Behandlungsplan und besprechen ihn mit Ihnen und Ihrem Kind. Häufig beginnt die Behandlung mit einer herausnehmbaren Spange, die die Kieferlage korrigiert oder Platz schafft. Die Feineinstellung der Zähne erfolgt dann meist mit einer festen Spange."
            - titel: Wie lange dauert sie?
              text:
                - "Die aktive Behandlung dauert je nach Befund häufig zwei bis vier Jahre. Danach wird das Ergebnis mit einem Retainer (Haltedraht oder Spange für die Nacht) stabilisiert."
            - titel: Was zahlt die Krankenkasse?
              text:
                - "Bei gesetzlich versicherten Kindern und Jugendlichen richtet sich die Kostenübernahme nach den kieferorthopädischen Indikationsgruppen (KIG). Wir schätzen bei der Untersuchung ein, ob die Voraussetzungen erfüllt sind, und erklären Ihnen, welche Leistungen die Kasse trägt."
          hinweis: "Allgemeine Informationen – ob und wie behandelt wird, entscheidet sich immer nach einer persönlichen Untersuchung."
      - icon: haken
        titel: Kieferorthopädie für Erwachsene
        text: "Zahnstellungen lassen sich in nahezu jedem Alter korrigieren. Bei ausgeprägten Kieferfehlstellungen arbeiten wir mit der Kieferchirurgie zusammen."
        details:
          einleitung: "Die Zeiten, in denen Spangen nur etwas für Kinder waren, sind lange vorbei. Zahnstellungen lassen sich bei den meisten Erwachsenen bis ins hohe Alter korrigieren."
          abschnitte:
            - titel: Für wen kommt eine Behandlung infrage?
              text:
                - "Viele Erwachsene kommen wegen schief stehender oder gedrehter Zähne, Lücken, Engständen oder weil sich Zähne nach einer früheren Behandlung wieder verschoben haben. Auch vor einer Versorgung mit Zahnersatz kann es sinnvoll sein, Zähne vorher in die richtige Position zu bringen."
            - titel: Wenn der Kiefer beteiligt ist
              text:
                - "Nach Abschluss des Wachstums lässt sich die Lage der Kiefer nicht mehr allein kieferorthopädisch verändern. Bei ausgeprägten Kieferfehlstellungen planen wir die Behandlung deshalb gemeinsam mit einer Kieferchirurgin oder einem Kieferchirurgen."
            - titel: Welche Apparaturen gibt es?
              text:
                - "Neben klassischen festen Spangen gibt es unauffällige Möglichkeiten: durchsichtige Schienen, zahnfarbene Brackets oder Brackets auf der Innenseite der Zähne (Lingualtechnik). Welche Variante für Sie geeignet ist, hängt vom Befund ab."
            - titel: Kosten
              text:
                - "Bei gesetzlich versicherten Erwachsenen übernimmt die Kasse die Kosten nur in Ausnahmefällen, vor allem bei kombiniert kieferorthopädisch-kieferchirurgischer Behandlung. Sonst erstellen wir Ihnen vorab einen individuellen Kostenplan. Bei Privatversicherung und Beihilfe hängt die Erstattung vom Vertrag ab."
          hinweis: "Allgemeine Informationen – ob und wie behandelt wird, entscheidet sich immer nach einer persönlichen Untersuchung."
      - icon: funke
        titel: Ästhetische Kieferorthopädie
        text: "Unauffällige Lösungen für alle, die im Alltag möglichst wenig von ihrer Behandlung zeigen möchten."
        details:
          einleitung: "Nicht jeder möchte, dass man die Spange sofort sieht – im Beruf, auf Fotos oder im Alltag. Deshalb gibt es heute mehrere unauffällige Möglichkeiten."
          abschnitte:
            - titel: Die Möglichkeiten
              text:
                - "Zahnfarbene Keramik-Brackets fallen deutlich weniger auf als Metall. Durchsichtige Schienen (Aligner) werden über die Zähne gesetzt und sind kaum zu erkennen. Bei der Lingualtechnik sitzen die Brackets auf der Innenseite der Zähne und sind von außen nicht sichtbar."
            - titel: Was passt zu mir?
              text:
                - "Das hängt vor allem von der Art der Fehlstellung ab, aber auch von Ihrem Alltag: Schienen sind herausnehmbar und erfordern viel Disziplin beim Tragen; festsitzende Varianten arbeiten unabhängig davon. Wir erklären Ihnen die Vor- und Nachteile nach der Untersuchung."
            - titel: Kosten
              text:
                - "Ästhetische Varianten sind in der Regel keine Kassenleistung. Sie erhalten vor Beginn einen transparenten Kostenplan."
          hinweis: "Allgemeine Informationen – ob und wie behandelt wird, entscheidet sich immer nach einer persönlichen Untersuchung."
      - icon: schild
        titel: Invisalign®
        text: "Durchsichtige, herausnehmbare Schienen, die Schritt für Schritt angepasst werden – geeignet für viele Zahnfehlstellungen."
        details:
          einleitung: "Bei der Behandlung mit Invisalign® werden die Zähne mit einer Folge durchsichtiger Kunststoffschienen schrittweise bewegt – kaum sichtbar und zum Essen und Zähneputzen herausnehmbar."
          abschnitte:
            - titel: So funktioniert es
              text:
                - "Anhand eines digitalen Scans Ihrer Zähne wird die Zahnbewegung am Computer geplant. Daraus entsteht eine Reihe von Schienen, die Sie nacheinander tragen – jede Schiene bewegt die Zähne ein kleines Stück weiter."
            - titel: Worauf es ankommt
              text:
                - "Damit die Schienen wirken, müssen sie etwa 22 Stunden am Tag getragen werden. Zum Essen und Trinken (außer Wasser) werden sie herausgenommen. In regelmäßigen Terminen kontrollieren wir den Fortschritt."
            - titel: Für wen geeignet?
              text:
                - "Schienen eignen sich für viele leichte bis mittlere Zahnfehlstellungen bei Jugendlichen und Erwachsenen. Ob sie in Ihrem Fall infrage kommen, klären wir bei der Untersuchung."
            - titel: Kosten
              text:
                - "Die Behandlung mit Schienen ist in der Regel keine Kassenleistung. Private Versicherungen erstatten je nach Tarif einen Teil. Vorab erhalten Sie einen Kostenplan."
          hinweis: "Invisalign® ist eine eingetragene Marke der Align Technology, Inc. Allgemeine Informationen – ob und wie behandelt wird, entscheidet sich nach einer persönlichen Untersuchung."
      - icon: werkzeug
        titel: Lingualtechnik
        text: "Feste Spange auf der Innenseite der Zähne – von außen nicht sichtbar."
        details:
          einleitung: "Bei der Lingualtechnik werden die Brackets auf der Innenseite der Zähne befestigt. So arbeitet eine feste Spange, ohne dass man sie von außen sieht."
          abschnitte:
            - titel: So funktioniert es
              text:
                - "Die Brackets werden individuell für Ihre Zähne angefertigt und auf der Zungenseite aufgeklebt. Wie bei einer klassischen festen Spange bewegen Drahtbögen die Zähne in die geplante Position."
            - titel: Was Sie wissen sollten
              text:
                - "In den ersten Tagen braucht die Zunge etwas Zeit, sich zu gewöhnen – kurzzeitig kann die Aussprache ungewohnt sein. Die Reinigung erfordert etwas mehr Sorgfalt; wir zeigen Ihnen, wie es geht."
            - titel: Kosten
              text:
                - "Die Lingualtechnik ist aufwendiger als eine klassische Spange und in der Regel keine Kassenleistung. Sie erhalten vorab einen Kostenplan."
          hinweis: "Allgemeine Informationen – ob und wie behandelt wird, entscheidet sich immer nach einer persönlichen Untersuchung."
      - icon: blatt
        titel: Ganzheitliche Kieferorthopädie
        text: "Wir betrachten Zähne, Kiefer und Funktion im Zusammenhang – zum Beispiel Kiefergelenk, Atmung und Schlucken."
        details:
          einleitung: "Eine Zahnfehlstellung ist selten nur eine Frage der Optik. Wie Zähne und Kiefer zueinander stehen, hängt mit Kauen, Schlucken, Atmen und dem Kiefergelenk zusammen."
          abschnitte:
            - titel: Mehr als gerade Zähne
              text:
                - "Ziel kieferorthopädischer Behandlung ist ein Ergebnis, das ästhetisch und funktionell passt: Ober- und Unterkiefer im richtigen Verhältnis und gestörte Abläufe beim Kauen und Schlucken möglichst ausgeglichen. Eine gute Ausformung der Zahnbögen kann zudem helfen, Karies und Kiefergelenksproblemen vorzubeugen."
            - titel: Wie wir vorgehen
              text:
                - "Bei der Untersuchung achten wir neben der Zahnstellung auch auf Mundatmung, Zungenlage, Schluckmuster und Kiefergelenk. Wo es sinnvoll ist, arbeiten wir mit anderen Fachrichtungen zusammen – etwa Logopädie, Physiotherapie oder Hals-Nasen-Ohren-Heilkunde."
          hinweis: "Allgemeine Informationen – ob und wie behandelt wird, entscheidet sich immer nach einer persönlichen Untersuchung."

