    label: Kieferorthopädie in Weimar
    titel: Gerade Zähne. <em>In&nbsp;ruhigen Händen.</em>
    text: "Fachzahnärztliche Kieferorthopädie für Kinder, Jugendliche und Erwachsene – mitten in Weimar, in der Schillerstraße."
    aktion: { text: Termin anfragen, ziel: "#anfrage" }
