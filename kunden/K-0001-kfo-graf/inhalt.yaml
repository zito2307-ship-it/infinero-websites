  - typ: faq
    anker: fragen
    menue: Fragen & Kosten
    flaeche: true
    label: Gut zu wissen
    titel: Häufige Fragen
    fragen:
      - frage: Wann sollte mein Kind zum ersten Mal zum Kieferorthopäden?
        antwort: "In der Regel ist der Beginn des Zahnwechsels im Seitenzahnbereich ein günstiger Zeitpunkt. Bestimmte Zahn- und Kieferfehlstellungen sollten aber früher behandelt werden. Den passenden Zeitpunkt besprechen wir nach einer Untersuchung persönlich mit Ihnen."
      - frage: Ist eine Behandlung auch für Erwachsene möglich?
        antwort: "Ja. Zahnstellungen lassen sich bei den meisten Erwachsenen bis ins hohe Alter korrigieren. Manche Kieferfehlstellungen lassen sich nach Abschluss des Wachstums allerdings nur gemeinsam mit einem kieferchirurgischen Eingriff optimal behandeln."
      - frage: Welche Spangen gibt es?
        antwort: "Herausnehmbare Spangen dienen meist der Vorbereitung, zum Beispiel zur Korrektur der Kieferlage oder um Platz zu schaffen. Mit festsitzenden Apparaturen werden die Zähne anschließend in die richtige Position gebracht. Daneben gibt es unauffällige Varianten wie durchsichtige Schienen oder Brackets auf der Zahninnenseite."
      - frage: Übernimmt die Krankenkasse die Kosten?
        antwort: "Bei gesetzlich versicherten Kindern und Jugendlichen richtet sich das nach den kieferorthopädischen Indikationsgruppen (KIG), die wir bei der Untersuchung einschätzen. Bei gesetzlich versicherten Erwachsenen übernimmt die Kasse die Kosten nur in Ausnahmefällen, etwa bei kombiniert kieferorthopädisch-kieferchirurgischer Behandlung. Bei Privatversicherten und Beihilfe hängt es vom Vertrag ab. Wir erstellen Ihnen gern einen individuellen Kostenplan."

