abschnitte:
  - typ: hero
    variante: dunkel
    bewertung: 4,6 bei 574 Google-Bewertungen
    label: Ristorante am Jenaer Markt
    titel: Italien. <em>Mitten am Markt.</em>
    text: "Auf der Terrasse direkt am Marktplatz sitzen, mitten in der Jenaer Altstadt – und dazu italienische Hausrezepte: Pasta, Pizza, Fisch und Fleisch. Drinnen gemütlich, draußen mittendrin."
    aktion: { text: Tisch reservieren, ziel: "#reservieren" }
    zweitaktion: { text: Zur Speisekarte, ziel: "#speisekarte" }

  - typ: vorteile
    punkte:
      - { icon: sonne, titel: Zwei Terrassen am Markt, text: "Draußen sitzen mitten im Herzen der Altstadt – mit Blick auf den Marktplatz." }
      - { icon: herz, titel: Original-Hausrezepte, text: "Italienische Klassiker, wie sie in der Familie gekocht werden – nicht wie aus dem Katalog." }
      - { icon: stern, titel: Hausgemachtes Eis, text: "Zum Abschluss oder einfach zwischendurch: Eis aus eigener Herstellung." }

  - typ: band
    anker: markt
    menue: Am Markt
    label: Mitten in der Altstadt
    titel: Essen, wo Jena am schönsten ist.
    text: "Unsere zwei Terrassen liegen direkt am Jenaer Marktplatz – Sie sitzen mitten in der Altstadt, mit Blick auf das Treiben am Markt. Drinnen erwartet Sie ein gemütliches, mediterranes Ambiente in historischen Mauern. Dazu kochen wir nach italienischen Original-Hausrezepten aus frischen Zutaten: Fisch und Fleisch, hausgemachte Pasta, Pizza und Eis. Buon Appetito!"

  - typ: preisliste
    anker: speisekarte
    menue: Speisekarte
    label: Auszug aus der Karte
    titel: Von Antipasti bis Dolci
    text: Eine Auswahl – die ganze Karte gibt es im Restaurant.
    gruppen:
      - titel: Antipasti
        posten:
          - { name: Vitello Tonnato, text: "hauchdünnes Kalbfleisch mit Thunfisch-Kapernsauce", preis: "13,90" }
          - { name: Carpaccio, text: "rohe Rindfleischscheiben mit Rucola und Grana Padano", preis: "14,90" }
          - { name: Parma e Melone, text: "luftgetrockneter Schinken mit Honigmelone", preis: "13,90" }
          - { name: Grill Mozzarella, text: "im Parmaschinken-Mantel mit Rucola und Parmesan", preis: "13,90" }
      - titel: Pasta & Risotto
        posten:
          - { name: Spaghetti Mare, text: "mit Meeresfrüchten", preis: "18,40" }
          - { name: Tagliatelle Porcini, text: "mit Steinpilzen", preis: "17,40" }
          - { name: Risotto Mafalda, text: "mit Lachs, Broccoli und Gorgonzolasauce", preis: "19,40" }
          - { name: Risotto d'Oro, text: "Rindfleischstreifen, Gemüse, Rotwein und Sahne", preis: "19,40" }
      - titel: Pizza
        posten:
          - { name: Pizza Sophia Loren, text: "Parmaschinken, Ei, Kirschtomaten, Spargel", preis: "18,40" }
          - { name: Pizza Felicita, text: "gegrillte Crevetten, Rucola, Kirschtomaten, Knoblauch", preis: "18,40" }
          - { name: Pizza da Vinci, text: "Rindfleischstreifen, Tomaten, Spargel, Sauce Hollandaise", preis: "18,40" }
          - { name: Pizza Bacio, text: "Bacon, rote Zwiebeln, Rucola, Grana Padano", preis: "17,40" }
      - titel: Fisch & Fleisch
        posten:
          - { name: Filetto alla Griglia, text: "gegrilltes Filetsteak mit Kräuterbutter", preis: "34,90" }
          - { name: Saltimbocca alla Romana, text: "mit Parmaschinken und Salbei", preis: "18,90" }
          - { name: Dorade alla Griglia, text: "gegrillte Goldbrasse nach Art des Hauses", preis: "26,90" }
          - { name: Sogliola al Vino Bianco, text: "gegrillte Seezunge mit Weißweinsauce", preis: "33,90" }
      - titel: Dolci
        posten:
          - { name: Tiramisu, text: "hausgemacht, mit Löffelbiscuits und Mascarpone", preis: "6,50" }
          - { name: Schoko Soufflé, text: "heißes Schokoküchlein mit flüssigem Kern", preis: "7,90" }
    hinweis: Preise in Euro. Allergene und Zusatzstoffe auf Nachfrage.

  - typ: anfrage
    anker: reservieren
    menue: Reservieren
    art: reservierung
    label: Reservierung
    titel: Ihr Tisch am Markt.
    text: Drinnen oder auf einer unserer zwei Terrassen – sagen Sie uns, wann Sie kommen möchten. Wir bestätigen Ihre Reservierung.
    zeiten: ["12:00", "12:30", "13:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30"]
    personen_max: 10
    nachricht: true
    nachricht_label: Wunsch (z. B. Terrasse, Anlass)

  - typ: bewertungen
    label: Gäste über uns
    titel: 4,6 Sterne bei 574 Bewertungen
    text: "Hunderte Gäste haben uns auf Google bewertet – im Schnitt mit 4,6 von 5 Sternen. Ein paar Stimmen:"
    eintraege:
      - { name: Gast auf Google, text: "Wir haben alle fünf leckere Pizzen gegessen und die Bedienung war auch top." }
      - { name: Gast auf Google, text: "Sehr nette Bedienung, das Essen schmeckt sehr gut, Preis-Leistungs-Verhältnis stimmt." }
      - { name: Gast auf Google, text: "Ich habe mir eine Pizza Funghi bestellt – geschmacklich ein Traum." }
    quelle: 4,6 von 5 Sternen bei 574 Bewertungen auf Google

  - typ: faq
    anker: fragen
    label: Gut zu wissen
    titel: Häufige Fragen
    fragen:
      - { frage: Wo genau liegt das Due Angeli?, antwort: "Am Markt 22 in 07743 Jena – direkt am Marktplatz, mitten in der Jenaer Altstadt." }
      - { frage: Kann man draußen sitzen?, antwort: "Ja. Wir haben zwei Terrassen direkt am Marktplatz. Wenn Sie draußen sitzen möchten, schreiben Sie es einfach in Ihre Reservierung." }
      - { frage: Wann haben Sie geöffnet?, antwort: "Täglich von Montag bis Sonntag, 11:00 bis 22:00 Uhr." }
      - { frage: Wie kann ich einen Tisch reservieren?, antwort: "Über das Reservierungsformular auf dieser Seite oder telefonisch unter 03641 7934707. Wir bestätigen Ihre Reservierung." }
      - { frage: Was gibt es bei Ihnen zu essen?, antwort: "Italienische Küche nach Original-Hausrezepten: Antipasti, Pasta und Risotto, Pizza, Fisch und Fleisch, Dolci und hausgemachtes Eis." }
      - { frage: Wie wird das Restaurant bewertet?, antwort: "Auf Google mit 4,6 von 5 Sternen bei 574 Bewertungen." }

  - typ: kontakt
    anker: kontakt
    menue: Kontakt
    titel: So finden Sie uns
    hinweis: Direkt am Marktplatz – mitten in der Jenaer Altstadt.
    karte: true

oeffnungszeiten:
  - { tage: Montag – Sonntag, zeit: "11:00 – 22:00" }

