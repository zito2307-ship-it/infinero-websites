      - { frage: Wie kann ich einen Tisch reservieren?, antwort: "Über das Reservierungsformular auf dieser Seite oder telefonisch unter 03641 7934707. Wir bestätigen Ihre Reservierung." }
      - { frage: Was gibt es bei Ihnen zu essen?, antwort: "Italienische Küche nach Original-Hausrezepten: Antipasti, Pasta und Risotto, Pizza, Fisch und Fleisch, Dolci und hausgemachtes Eis." }
      - { frage: Wie wird das Restaurant bewertet?, antwort: "Auf Google mit 4,6 von 5 Sternen bei 574 Bewertungen." }

